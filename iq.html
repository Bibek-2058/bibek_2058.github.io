<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Practice - Study Assist</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-gray-800/95 backdrop-blur border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="p-2 bg-blue-600 rounded-lg text-white">
                    <i class="fa-solid fa-brain text-xl"></i>
                </div>
                <div>
                    <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">Study Assist</span>
                    <span class="text-[10px] block text-gray-400 -mt-1 font-semibold uppercase tracking-wider">IQ & Reasoning Hub</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">
                    <i class="fa-solid fa-book-open mr-1"></i> Notes
                </a>
                <button id="theme-toggle" onclick="toggleTheme()" class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Category Selection Header -->
        <div class="mb-6 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
            <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">IQ & Reasoning Practice</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Select a main category and topic to practice interactive questions.</p>
            
            <!-- Category Tabs -->
            <div class="flex flex-wrap gap-2">
                <button onclick="switchCategory('verbal')" id="cat-verbal" class="cat-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-comments"></i> Verbal Reasoning
                </button>
                <button onclick="switchCategory('non-verbal')" id="cat-non-verbal" class="cat-btn bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-shapes"></i> Non-Verbal Reasoning
                </button>
                <button onclick="switchCategory('numerical')" id="cat-numerical" class="cat-btn bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-calculator"></i> Numerical Reasoning
                </button>
            </div>
        </div>

        <!-- Topics Bar -->
        <div id="topicsContainer" class="flex flex-wrap gap-2 mb-6"></div>

        <!-- Questions View -->
        <div id="questionsContainer" class="space-y-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-6 text-center text-xs text-gray-500 dark:text-gray-400 mt-auto">
        <p>&copy; 2026 Study Assist. All rights reserved.</p>
    </footer>

    <!-- Logic Script -->
    <script>
        // Data Structure for Categories, Topics, and Questions
        const iqData = {
            verbal: {
                title: "Verbal Reasoning",
                topics: [
                    {
                        id: "analogy",
                        name: "Analogy",
                        questions: [
                            {
                                id: "v1",
                                text: "Book is to Reading as Fork is to ____?",
                                options: ["Eating", "Writing", "Cooking", "Cutting"],
                                correct: 0,
                                explanation: "Books are used for reading, and forks are used for eating."
                            },
                            {
                                id: "v2",
                                text: "Light is to Dark as High is to ____?",
                                options: ["Tall", "Low", "Deep", "Short"],
                                correct: 1,
                                explanation: "'Low' is the exact antonym of 'High'."
                            }
                        ]
                    },
                    {
                        id: "coding",
                        name: "Coding-Decoding",
                        questions: [
                            {
                                id: "v3",
                                text: "If CAT is coded as 3120, how is DOG coded?",
                                options: ["4157", "41515", "41570", "41512"],
                                correct: 0,
                                explanation: "Position of letters: D=4, O=15, G=7 -> 4157."
                            }
                        ]
                    }
                ]
            },
            "non-verbal": {
                title: "Non-Verbal Reasoning",
                topics: [
                    {
                        id: "patterns",
                        name: "Pattern Completion",
                        questions: [
                            {
                                id: "nv1",
                                text: "Which shape comes next in the sequence: Square, Circle, Square, Circle, ____?",
                                options: ["Triangle", "Square", "Circle", "Pentagon"],
                                correct: 1,
                                explanation: "The sequence alternates between Square and Circle."
                            }
                        ]
                    }
                ]
            },
            numerical: {
                title: "Numerical Reasoning",
                topics: [
                    {
                        id: "series",
                        name: "Number Series",
                        questions: [
                            {
                                id: "n1",
                                text: "Find the missing number in the sequence: 2, 4, 8, 16, ____?",
                                options: ["20", "24", "32", "64"],
                                correct: 2,
                                explanation: "Each number is multiplied by 2 to get the next number."
                            },
                            {
                                id: "n2",
                                text: "Find the odd one out: 3, 5, 7, 9, 11",
                                options: ["3", "7", "9", "11"],
                                correct: 2,
                                explanation: "9 is a composite number ($3 \\times 3$), while all others are prime numbers."
                            }
                        ]
                    }
                ]
            }
        };

        let currentCategory = 'verbal';
        let currentTopicId = iqData.verbal.topics[0].id;

        // Theme Initialization
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon text-gray-600';
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-gray-600';
        }

        // Category Switcher
        function switchCategory(catKey) {
            currentCategory = catKey;
            
            // Update Tab Active Styling
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2';
            });
            const activeBtn = document.getElementById(`cat-${catKey}`);
            activeBtn.className = 'cat-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2';

            // Reset topic to first available topic in category
            const topics = iqData[catKey].topics;
            currentTopicId = topics.length > 0 ? topics[0].id : null;

            renderTopics();
            renderQuestions();
        }

        // Render Topics for Selected Category
        function renderTopics() {
            const container = document.getElementById('topicsContainer');
            container.innerHTML = '';
            const topics = iqData[currentCategory].topics;

            topics.forEach(topic => {
                const isSelected = topic.id === currentTopicId;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentTopicId = topic.id;
                    renderTopics();
                    renderQuestions();
                };
                btn.className = `px-3.5 py-1.5 rounded-lg text-xs font-semibold transition border ${
                    isSelected 
                    ? 'bg-blue-50 dark:bg-blue-900/40 border-blue-600 text-blue-600 dark:text-blue-300' 
                    : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50'
                }`;
                btn.innerHTML = `<i class="fa-solid fa-hashtag text-[10px] mr-1"></i> ${topic.name}`;
                container.appendChild(btn);
            });
        }

        // Render Questions for Selected Topic
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const categoryData = iqData[currentCategory];
            const topic = categoryData.topics.find(t => t.id === currentTopicId);

            if (!topic || topic.questions.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-gray-500 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700">No questions available for this topic yet.</div>`;
                return;
            }

            topic.questions.forEach((q, qIndex) => {
                const qCard = document.createElement('div');
                qCard.className = 'bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm';
                
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <label id="lbl-${q.id}-${oIndex}" class="option-label flex items-center p-3 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-750 transition text-xs font-medium">
                            <input type="radio" name="q-${q.id}" value="${oIndex}" class="mr-3 text-blue-600 focus:ring-blue-500">
                            <span>${String.fromCharCode(65 + oIndex)}. ${opt}</span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="text-sm font-bold text-gray-900 dark:text-white">Q${qIndex + 1}. ${q.text}</h3>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        ${optionsHTML}
                    </div>

                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-3 border-t border-gray-100 dark:border-gray-700">
                        <button onclick="checkAnswer('${q.id}', ${q.correct})" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check-double"></i> Check Answer
                        </button>
                        <div id="result-${q.id}" class="hidden text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2"></div>
                    </div>
                    <div id="exp-${q.id}" class="hidden mt-3 p-3 bg-gray-50 dark:bg-gray-900 rounded-xl text-xs text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                `;
                container.appendChild(qCard);
            });
        }

        // Answer Checking Engine
        function checkAnswer(questionId, correctIndex) {
            const selectedOpt = document.querySelector(`input[name="q-${questionId}"]:checked`);
            const resultDiv = document.getElementById(`result-${questionId}`);
            const expDiv = document.getElementById(`exp-${questionId}`);

            if (!selectedOpt) {
                alert("Please select an option first!");
                return;
            }

            const selectedValue = parseInt(selectedOpt.value);

            // Reset labels border/background styles
            const options = document.querySelectorAll(`[id^="lbl-${questionId}-"]`);
            options.forEach((lbl, idx) => {
                lbl.className = 'option-label flex items-center p-3 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer text-xs font-medium';
                
                // Highlight Correct Option Green
                if (idx === correctIndex) {
                    lbl.classList.add('bg-emerald-50', 'dark:bg-emerald-950/40', 'border-emerald-500', 'text-emerald-700', 'dark:text-emerald-300');
                }
                // Highlight Incorrect Selection Red
                if (idx === selectedValue && selectedValue !== correctIndex) {
                    lbl.classList.add('bg-rose-50', 'dark:bg-rose-950/40', 'border-rose-500', 'text-rose-700', 'dark:text-rose-300');
                }
            });

            // Display Status Banner
            resultDiv.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
            if (selectedValue === correctIndex) {
                resultDiv.classList.add('bg-emerald-100', 'dark:bg-emerald-900/50', 'text-emerald-800', 'dark:text-emerald-300');
                resultDiv.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> Correct!`;
            } else {
                resultDiv.classList.add('bg-rose-100', 'dark:bg-rose-900/50', 'text-rose-800', 'dark:text-rose-300');
                resultDiv.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600"></i> Incorrect!`;
            }

            // Show explanation
            expDiv.classList.remove('hidden');
        }

        window.onload = () => {
            initTheme();
            switchCategory('verbal');
        };
    </script>
</body>
</html>
