    <!-- SCRIPT ENGINE -->
    <script>
        let pscNotes = [];
        let englishBlogs = [];
        let globalNotes = [];
        let currentCategory = 'English Blogs'; // DEFAULT TAB: English Blogs First
        let editModeActive = false;

        function updateNepalClock() {
            const now = new Date();
            const timeStr = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(now);
            const dateStr = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kathmandu', month: 'short', day: '2-digit', year: 'numeric' }).format(now);
            if (document.getElementById('nepalTime')) document.getElementById('nepalTime').textContent = timeStr;
            if (document.getElementById('nepalDate')) document.getElementById('nepalDate').textContent = dateStr;
        }
        setInterval(updateNepalClock, 1000);
        updateNepalClock();

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
        }

        function toggleTableBuilder() {
            const container = document.getElementById('tableBuilderContainer');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) buildTableGrid();
        }

        function buildTableGrid() {
            const rows = parseInt(document.getElementById('tblRows').value) || 1;
            const cols = parseInt(document.getElementById('tblCols').value) || 1;
            const includeHeader = document.getElementById('tblHeaderToggle').value === 'yes';
            const table = document.getElementById('tblInteractiveGrid');
            table.innerHTML = '';

            if (includeHeader) {
                const thead = document.createElement('thead');
                const headTr = document.createElement('tr');
                for (let c = 0; c < cols; c++) {
                    const th = document.createElement('th');
                    th.className = 'p-1';
                    th.innerHTML = `<input type="text" placeholder="Header ${c + 1}" class="tbl-header-input w-full p-1 border rounded text-xs font-bold bg-slate-100 dark:bg-slate-800 dark:border-slate-700">`;
                    headTr.appendChild(th);
                }
                thead.appendChild(headTr);
                table.appendChild(thead);
            }

            const tbody = document.createElement('tbody');
            for (let r = 0; r < rows; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < cols; c++) {
                    const td = document.createElement('td');
                    td.className = 'p-1';
                    td.innerHTML = `<input type="text" placeholder="Cell ${r + 1},${c + 1}" class="tbl-cell-input w-full p-1 border rounded text-xs dark:bg-slate-800 dark:border-slate-700" data-row="${r}" data-col="${c}">`;
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
        }

        function insertTableToContent() {
            const rows = parseInt(document.getElementById('tblRows').value) || 1;
            const cols = parseInt(document.getElementById('tblCols').value) || 1;
            const includeHeader = document.getElementById('tblHeaderToggle').value === 'yes';
            const borderStyle = document.getElementById('tblBorder').value;

            const headerInputs = document.querySelectorAll('.tbl-header-input');
            const cellInputs = document.querySelectorAll('.tbl-cell-input');

            const isBordered = borderStyle === 'bordered';
            const tableClass = isBordered 
                ? 'w-full text-sm text-left border-collapse border border-slate-300 dark:border-slate-700 my-4' 
                : 'w-full text-sm text-left border-collapse my-4';
            const cellBorder = isBordered ? 'border border-slate-300 dark:border-slate-700' : 'border-b border-slate-200 dark:border-slate-800';

            let tableHTML = `\n<div class="overflow-x-auto my-4">\n  <table class="${tableClass}">\n`;

            if (includeHeader) {
                tableHTML += `    <thead class="bg-slate-100 dark:bg-slate-800 font-bold">\n      <tr>\n`;
                for (let c = 0; c < cols; c++) {
                    const val = headerInputs[c]?.value.trim() || `Header ${c + 1}`;
                    tableHTML += `        <th class="p-2.5 ${cellBorder}">${val}</th>\n`;
                }
                tableHTML += `      </tr>\n    </thead>\n`;
            }

            tableHTML += `    <tbody>\n`;
            for (let r = 0; r < rows; r++) {
                tableHTML += `      <tr>\n`;
                for (let c = 0; c < cols; c++) {
                    const cell = Array.from(cellInputs).find(i => parseInt(i.dataset.row) === r && parseInt(i.dataset.col) === c);
                    const val = cell?.value || '';
                    tableHTML += `        <td class="p-2.5 ${cellBorder}">${val}</td>\n`;
                }
                tableHTML += `      </tr>\n`;
            }
            tableHTML += `    </tbody>\n  </table>\n</div>\n`;

            const textarea = document.getElementById('formContent');
            const start = textarea.selectionStart;
            textarea.setRangeText(tableHTML, start, textarea.selectionEnd, 'end');
            alert("Table inserted into content area!");
        }

        // LOAD FROM BOTH data/blogs.json AND data/pscnotes.json
        async function loadNotes() {
            try {
                const ts = Date.now();
                const [blogRes, pscRes] = await Promise.all([
                    fetch(`data/blogs.json?t=${ts}`).catch(() => null),
                    fetch(`data/pscnotes.json?t=${ts}`).catch(() => null)
                ]);

                englishBlogs = (blogRes && blogRes.ok) ? await blogRes.json() : [];
                pscNotes = (pscRes && pscRes.ok) ? await pscRes.json() : [];

                englishBlogs.forEach(n => n.category = 'English Blogs');
                pscNotes.forEach(n => n.category = 'PSC Notes');

                globalNotes = [...englishBlogs, ...pscNotes];

                populateAdminDropdown();

                const urlParams = new URLSearchParams(window.location.search);
                const noteId = urlParams.get('noteId');
                if (noteId) renderArticleView(noteId);
                else renderNotes();
            } catch (err) {
                console.error("Error loading JSON files:", err);
            }
        }

        function populateAdminDropdown() {
            const select = document.getElementById('selectNoteToEdit');
            select.innerHTML = '<option value="">➕ Create New Entry</option>';
            globalNotes.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n.id;
                opt.textContent = `✏️ [${n.category}] ${n.title}`;
                select.appendChild(opt);
            });
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            
            document.getElementById('btn-cat-blogs').className = category === 'English Blogs' ? 'px-4 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5' : 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1.5';
            document.getElementById('btn-cat-psc').className = category === 'PSC Notes' ? 'px-4 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5' : 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1.5';

            renderNotes();
        }

        function renderNotes() {
            document.getElementById('catalogView').classList.remove('hidden');
            document.getElementById('articleView').classList.add('hidden');

            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            let filtered = globalNotes.filter(n => n.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400 text-sm font-medium">No published entries found in this section yet.</div>`;
                return;
            }

            if (currentCategory === 'English Blogs') {
                // MAGAZINE EDITORIAL BLOG LAYOUT
                const blogGrid = document.createElement('div');
                blogGrid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

                filtered.forEach(blog => {
                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-slate-800 rounded-3xl overflow-hidden border border-slate-100 dark:border-slate-700/80 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group';
                    
                    const coverHTML = blog.cover 
                        ? `<div class="h-48 overflow-hidden relative">
                             <img src="${blog.cover}" alt="${blog.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                             <span class="absolute top-3 left-3 bg-indigo-600/90 backdrop-blur text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider">${blog.topic || 'Article'}</span>
                           </div>`
                        : `<div class="h-32 gradient-brand p-4 flex flex-col justify-between relative">
                             <span class="bg-white/20 backdrop-blur text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider w-max">${blog.topic || 'Article'}</span>
                             <i class="${blog.icon || 'fa-solid fa-newspaper'} text-white/30 text-5xl absolute right-4 bottom-2"></i>
                           </div>`;

                    card.innerHTML = `
                        <div>
                            ${coverHTML}
                            <div class="p-5">
                                <div class="flex items-center justify-between text-xs text-slate-400 mb-2 font-medium">
                                    <span>${blog.readTime || '3 min read'}</span>
                                    <span class="font-bold text-indigo-600 dark:text-indigo-400">${blog.code}</span>
                                </div>
                                <h2 class="font-extrabold text-base sm:text-lg text-slate-900 dark:text-white mb-2 line-clamp-2 group-hover:text-indigo-600 transition">${blog.title}</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-3">${blog.desc}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <a href="index.html?noteId=${blog.id}" class="w-full bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-700 font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2">
                                Read Article <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    `;
                    blogGrid.appendChild(card);
                });
                container.appendChild(blogGrid);
            } else {
                // CLASSIC HIGH-DENSITY PSC NOTES GRID
                const grouped = {};
                filtered.forEach(note => {
                    const topic = note.topic?.trim() || 'General Topics';
                    if (!grouped[topic]) grouped[topic] = [];
                    grouped[topic].push(note);
                });

                Object.keys(grouped).forEach(topicName => {
                    const topicSection = document.createElement('div');
                    topicSection.className = 'topic-group space-y-4';
                    topicSection.innerHTML = `
                        <div class="flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                            <i class="fa-solid fa-folder-open text-indigo-600 dark:text-indigo-400 text-lg"></i>
                            <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">${topicName}</h2>
                            <span class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 font-bold px-2 py-0.5 rounded-full">${grouped[topicName].length}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 topic-grid"></div>
                    `;

                    const grid = topicSection.querySelector('.topic-grid');
                    grouped[topicName].forEach(note => {
                        const card = document.createElement('div');
                        card.className = 'note-card bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-100 dark:border-slate-700/80 shadow-sm flex flex-col justify-between hover:shadow-md transition';
                        card.innerHTML = `
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center gap-2">
                                        <div class="p-2 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 rounded-lg shrink-0">
                                            <i class="${note.icon || 'fa-solid fa-book'} text-lg"></i>
                                        </div>
                                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">${note.code}</span>
                                    </div>
                                    ${note.pdf ? '<span class="text-[11px] text-slate-400 font-medium"><i class="fa-solid fa-file-pdf text-red-500 mr-1"></i>PDF</span>' : ''}
                                </div>
                                <h2 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white mb-2 line-clamp-2">${note.title}</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-4 line-clamp-3">${note.desc}</p>
                            </div>
                            <div class="pt-2 border-t border-slate-100 dark:border-slate-700">
                                <a href="index.html?noteId=${note.id}" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Notes
                                </a>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    container.appendChild(topicSection);
                });
            }
        }

        function renderArticleView(id) {
            const note = globalNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('catalogView').classList.add('hidden');
            document.getElementById('articleView').classList.remove('hidden');

            document.title = `${note.title} - Study Assist`;
            document.getElementById('articleTopic').textContent = `${note.category} • ${note.topic}`;
            document.getElementById('articleCode').textContent = note.code;
            document.getElementById('articleIcon').innerHTML = `<i class="${note.icon || 'fa-solid fa-book'}"></i>`;
            document.getElementById('articleTitle').textContent = note.title;
            document.getElementById('articleDesc').textContent = note.desc;
            document.getElementById('articleContent').innerHTML = note.content;

            const coverContainer = document.getElementById('articleCoverContainer');
            if (note.cover) {
                coverContainer.classList.remove('hidden');
                document.getElementById('articleCoverImg').src = note.cover;
            } else {
                coverContainer.classList.add('hidden');
            }

            document.getElementById('articleAuthor').textContent = note.readTime ? note.readTime : '';

            const pdfBanner = document.getElementById('pdfBanner');
            if (note.pdf) {
                pdfBanner.classList.remove('hidden');
                document.getElementById('pdfDownloadBtn').href = note.pdf;
            } else {
                pdfBanner.classList.add('hidden');
            }
        }

        function showCatalog() { window.location.href = 'index.html'; }

        function populateFormForEdit() {
            const id = document.getElementById('selectNoteToEdit').value;
            const note = globalNotes.find(n => n.id === id);
            if (note) {
                document.getElementById('editNoteId').value = note.id;
                document.getElementById('formCategory').value = note.category;
                document.getElementById('formTopic').value = note.topic;
                document.getElementById('formCode').value = note.code;
                document.getElementById('formIcon').value = note.icon;
                document.getElementById('formTitle').value = note.title;
                document.getElementById('formDesc').value = note.desc;
                document.getElementById('formContent').value = note.content;
                document.getElementById('formCover').value = note.cover || '';
                document.getElementById('formReadTime').value = note.readTime || '';
            } else {
                document.getElementById('editNoteId').value = '';
                document.getElementById('githubAdminForm').reset();
            }
        }

        async function handleGitHubSave(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            try {
                const selectedCat = document.getElementById('formCategory').value;
                const targetPath = selectedCat === 'English Blogs' ? 'data/blogs.json' : 'data/pscnotes.json';
                let targetArray = selectedCat === 'English Blogs' ? englishBlogs : pscNotes;

                const id = document.getElementById('editNoteId').value || Date.now().toString();
                const noteObj = {
                    id,
                    category: selectedCat,
                    topic: document.getElementById('formTopic').value.trim(),
                    code: document.getElementById('formCode').value,
                    icon: document.getElementById('formIcon').value,
                    title: document.getElementById('formTitle').value,
                    desc: document.getElementById('formDesc').value,
                    content: document.getElementById('formContent').value,
                    cover: document.getElementById('formCover').value.trim(),
                    readTime: document.getElementById('formReadTime').value.trim(),
                    pdf: ""
                };

                const index = targetArray.findIndex(n => n.id === id);
                if (index > -1) targetArray[index] = noteObj;
                else targetArray.push(noteObj);

                const jsonSha = await getFileSHA(repo, token, targetPath);
                const jsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(targetArray, null, 2))));

                await uploadToGitHub(repo, token, targetPath, jsonContent, `Update ${selectedCat}: ${noteObj.title}`, jsonSha);

                alert(`Successfully published to ${targetPath}!`);
                closeModal('adminModal');
                loadNotes();
            } catch (err) {
                alert("GitHub API Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Save to Selected JSON File';
            }
        }

        async function uploadToGitHub(repo, token, path, contentBase64, message, sha = null) {
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            const body = { message, content: contentBase64 };
            if (sha) body.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        async function getFileSHA(repo, token, path) {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.sha;
                }
            } catch (e) {}
            return null;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                openModal('adminModal');
            }
        });

        window.onload = () => {
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            initTheme();
            loadNotes();
        };
    </script>
</body>
