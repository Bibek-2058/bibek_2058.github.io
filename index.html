<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Assist - Educational Notes & Statistical Tools</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-gray-800/95 backdrop-blur border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="p-2 bg-blue-600 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">Study Assist</span>
                    <span class="text-[10px] block text-gray-400 -mt-1 font-semibold uppercase tracking-wider">Educational Hub</span>
                </div>
            </div>
            <button id="theme-toggle" class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <section id="notes-section">
            <div class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                <div>
                    <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white">PSC & General Study Syllabus Notes</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Interactive articles and PDF references synchronized with GitHub.</p>
                </div>
                <div class="relative w-full md:w-80">
                    <input type="text" id="searchInput" onkeyup="filterNotes()" placeholder="Search topics..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <!-- Dynamic Notes Grid -->
            <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-6 text-center text-xs text-gray-500 dark:text-gray-400 mt-auto">
        <p>&copy; 2026 Study Assist. Press <kbd class="px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 border rounded">Ctrl + Shift + A</kbd> for GitHub Admin Portal.</p>
    </footer>

    <!-- BLOG READ MODAL -->
    <div id="blogModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 sm:p-8 max-w-3xl w-full max-h-[85vh] overflow-y-auto relative shadow-2xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-4 mb-4">
                    <div class="flex items-center gap-3">
                        <div id="modalIcon" class="p-3 bg-blue-100 dark:bg-blue-900/40 text-blue-600 rounded-xl text-xl"></div>
                        <div>
                            <span id="modalTopicCode" class="text-xs font-bold text-blue-600 uppercase"></span>
                            <h2 id="modalTitle" class="text-xl font-bold text-gray-900 dark:text-white"></h2>
                        </div>
                    </div>
                    <button onclick="closeModal('blogModal')" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="modalContent" class="text-sm leading-relaxed text-gray-700 dark:text-gray-300 space-y-4 my-4"></div>
            </div>
            <div class="border-t border-gray-200 dark:border-gray-700 pt-4 mt-6 flex items-center justify-between">
                <span class="text-xs text-gray-400">Study Assist Verified Resource</span>
                <div id="pdfDownloadWrapper"></div>
            </div>
        </div>
    </div>

    <!-- GITHUB ADMIN DASHBOARD MODAL -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl border border-gray-100 dark:border-gray-700">
            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    <i class="fa-brands fa-github text-blue-600"></i> GitHub Content Admin
                </h3>
                <button onclick="closeModal('adminModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="githubAdminForm" onsubmit="handleGitHubSave(event)" class="space-y-4">
                <input type="hidden" id="editNoteId">
                
                <div class="p-3 bg-blue-50 dark:bg-gray-900/50 rounded-xl space-y-3 border border-blue-100 dark:border-gray-700">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">GitHub Owner/Repo</label>
                            <input type="text" id="ghRepo" required placeholder="username/repository" class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Personal Access Token</label>
                            <input type="password" id="ghToken" required placeholder="ghp_xxxxxxxxxxxx" class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-xs">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Topic Code</label>
                        <input type="text" id="formCode" required placeholder="e.g. Topic 1.1" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">FontAwesome Icon</label>
                        <input type="text" id="formIcon" required placeholder="fa-solid fa-book" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Title</label>
                    <input type="text" id="formTitle" required placeholder="Note Title" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Short Description</label>
                    <input type="text" id="formDesc" required placeholder="Brief preview text" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Blog Article (HTML Supported)</label>
                    <textarea id="formContent" rows="4" required placeholder="Full content..." class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-1">Upload PDF File (Optional)</label>
                    <input type="file" id="formPdfFile" accept="application/pdf" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="saveBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish to GitHub
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let globalNotes = [];

        // Load credentials from local storage if available
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

        // Fetch notes from JSON file in GitHub
        async function loadNotes() {
            try {
                const res = await fetch('data/notes.json?t=' + Date.now());
                globalNotes = await res.json();
                renderNotes();
            } catch (err) {
                console.error("Could not fetch data/notes.json", err);
            }
        }

        // Render Cards
        function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            globalNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/80 shadow-sm flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <div class="p-2 bg-blue-50 dark:bg-blue-900/40 text-blue-600 rounded-lg">
                                    <i class="${note.icon} text-lg"></i>
                                </div>
                                <span class="text-xs font-bold uppercase tracking-wider text-blue-600">${note.code}</span>
                            </div>
                            ${note.pdf ? '<span class="text-[11px] text-gray-400 font-medium"><i class="fa-solid fa-file-pdf text-red-500 mr-1"></i>PDF</span>' : '<span class="text-[11px] text-gray-400 italic">Article</span>'}
                        </div>
                        <h2 class="font-bold text-base text-gray-900 dark:text-white mb-2 line-clamp-2">${note.title}</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed mb-4 line-clamp-3">${note.desc}</p>
                    </div>
                    <div class="flex items-center gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                        <button onclick="openBlogModal('${note.id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-eye"></i> View Note
                        </button>
                        <button onclick="editNote('${note.id}')" class="bg-gray-100 dark:bg-gray-700 p-2 rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openBlogModal(id) {
            const note = globalNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('modalIcon').innerHTML = `<i class="${note.icon}"></i>`;
            document.getElementById('modalTopicCode').textContent = note.code;
            document.getElementById('modalTitle').textContent = note.title;
            document.getElementById('modalContent').innerHTML = note.content;

            const pdfWrapper = document.getElementById('pdfDownloadWrapper');
            pdfWrapper.innerHTML = note.pdf ? `<a href="${note.pdf}" download class="bg-emerald-600 text-white font-semibold py-2 px-4 rounded-xl text-xs flex items-center gap-2"><i class="fa-solid fa-download"></i> Download PDF</a>` : `<span class="text-xs text-gray-400 italic">No PDF attached.</span>`;

            openModal('blogModal');
        }

        // GitHub API Integration Functions
        async function handleGitHubSave(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading to GitHub...';

            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            const fileInput = document.getElementById('formPdfFile');
            let pdfPath = document.getElementById('editNoteId').dataset.pdfPath || '';

            try {
                // 1. Upload PDF if selected
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileName = `pdfs/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                    const base64Content = await fileToBase64(file);
                    
                    await uploadToGitHub(repo, token, fileName, base64Content, `Upload PDF: ${file.name}`);
                    pdfPath = fileName;
                }

                // 2. Prepare JSON Entry
                const id = document.getElementById('editNoteId').value || Date.now().toString();
                const noteObj = {
                    id,
                    code: document.getElementById('formCode').value,
                    icon: document.getElementById('formIcon').value,
                    title: document.getElementById('formTitle').value,
                    desc: document.getElementById('formDesc').value,
                    content: document.getElementById('formContent').value,
                    pdf: pdfPath
                };

                const index = globalNotes.findIndex(n => n.id === id);
                if (index > -1) globalNotes[index] = noteObj;
                else globalNotes.push(noteObj);

                // 3. Commit updated data/notes.json to GitHub
                const jsonSha = await getFileSHA(repo, token, 'data/notes.json');
                const jsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(globalNotes, null, 2))));

                await uploadToGitHub(repo, token, 'data/notes.json', jsonContent, `Update note: ${noteObj.title}`, jsonSha);

                alert("Successfully saved to GitHub!");
                closeModal('adminModal');
                loadNotes();
            } catch (err) {
                alert("GitHub API Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish to GitHub';
            }
        }

        // Helper: Convert File to Raw Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // Helper: GitHub REST API Upload
        async function uploadToGitHub(repo, token, path, contentBase64, message, sha = null) {
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            const body = { message, content: contentBase64 };
            if (sha) body.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        // Helper: Get File SHA for updating existing JSON
        async function getFileSHA(repo, token, path) {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.sha;
                }
            } catch (e) {}
            return null;
        }

        function editNote(id) {
            const note = globalNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('editNoteId').value = note.id;
            document.getElementById('editNoteId').dataset.pdfPath = note.pdf || '';
            document.getElementById('formCode').value = note.code;
            document.getElementById('formIcon').value = note.icon;
            document.getElementById('formTitle').value = note.title;
            document.getElementById('formDesc').value = note.desc;
            document.getElementById('formContent').value = note.content;

            openModal('adminModal');
        }

        function filterNotes() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.note-card').forEach(c => {
                c.style.display = c.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                openModal('adminModal');
            }
        });

        window.onload = loadNotes;
    </script>
</body>
</html>
